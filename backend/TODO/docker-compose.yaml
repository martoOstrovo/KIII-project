services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: tododatabase
      POSTGRES_USER: marto
      POSTGRES_PASSWORD: marto123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marto -d tododatabase"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: martogr/todo-backend:latest
    build:
      context: .
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep UP" ]
      interval: 10s
      timeout: 3s
      retries: 10
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: martogr/todo-frontend:latest
    build:
      context: ../../frontend/todo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
